name: Android App Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      VOTECOUNTING_KEYSTORE_BASE64: ${{ secrets.VOTECOUNTING_KEYSTORE_BASE64 }}
      VOTECOUNTING_KEYSTORE_PASSWORD: ${{ secrets.VOTECOUNTING_KEYSTORE_PASSWORD }}
      VOTECOUNTING_KEY_ALIAS: ${{ secrets.VOTECOUNTING_KEY_ALIAS }}
      VOTECOUNTING_KEY_PASSWORD: ${{ secrets.VOTECOUNTING_KEY_PASSWORD }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses </dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Restore persistent APK signing keystore
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${VOTECOUNTING_KEYSTORE_BASE64}" || -z "${VOTECOUNTING_KEYSTORE_PASSWORD}" || -z "${VOTECOUNTING_KEY_ALIAS}" || -z "${VOTECOUNTING_KEY_PASSWORD}" ]]; then
            echo "::error::Add the four VOTECOUNTING_* signing secrets in GitHub repository Settings > Secrets and variables > Actions."
            exit 1
          fi
          printf '%s' "${VOTECOUNTING_KEYSTORE_BASE64}" | base64 --decode > debug.keystore
          test -s debug.keystore
          chmod 600 debug.keystore


      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: vote-counting-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
